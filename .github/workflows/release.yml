name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source_release:
    name: Verify and publish source release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - name: Verify tag and compatibility manifest
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          python scripts/check_compatibility.py
          python -m unittest discover -s tests -v
      - name: Build deterministic source archive
        run: |
          version="$(tr -d '\n' < VERSION)"
          archive="warp-celestial-v${version}-source.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="warp-celestial-v${version}/" \
            --output="$archive" \
            HEAD
          sha256sum "$archive" > "${archive}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\n' < VERSION)"
          archive="warp-celestial-v${version}-source.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "${archive}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Warp Celestial $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
