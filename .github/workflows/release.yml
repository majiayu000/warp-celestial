name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source_checks:
    name: Verify source release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.8"
      - name: Verify tag, ancestry, scripts, and compatibility manifest
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          bash -n install.sh scripts/install_safety.sh
          shellcheck -x install.sh scripts/install_safety.sh
          python -m py_compile claude-token.py scripts/*.py tests/*.py
          python scripts/check_compatibility.py
          python -m unittest discover -s tests -v

  metal_poc:
    name: Verify standalone Metal proof of concept
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          cargo check --locked
          cargo test --locked

  warp_patch:
    name: Verify Warp patch, Metal shaders, tests, and clippy
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      WARP_CHANNEL: oss
      WARP_BIN_NAME: warp-oss
      MACOSX_DEPLOYMENT_TARGET: "10.14"
    steps:
      - name: Check out Warp Celestial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: warp-celestial
      - name: Check out the tested Warp revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: warpdotdev/warp
          ref: 69ce3728acae0b01c2f457b65a90c144664686aa
          path: warp
      - name: Apply and validate the renderer patch
        run: |
          git -C warp apply --check ../warp-celestial/patches/celestial-effect.patch
          git -C warp apply ../warp-celestial/patches/celestial-effect.patch
          git -C warp apply --reverse --check ../warp-celestial/patches/celestial-effect.patch
      - name: Compile the combined Metal shader library
        run: |
          shader_dir="$PWD/warp/crates/warpui/src/platform/mac/rendering/metal/shaders"
          xcrun -sdk macosx metal \
            -I "$shader_dir" \
            -c "$shader_dir/shaders.metal" \
            -o "$RUNNER_TEMP/warp-celestial.air"
          xcrun -sdk macosx metallib \
            "$RUNNER_TEMP/warp-celestial.air" \
            -o "$RUNNER_TEMP/warp-celestial.metallib"
      - name: Install protobuf compiler
        run: brew install protobuf
      - name: Run focused renderer tests
        working-directory: warp
        run: |
          cargo test -p warp --lib signal_is_transparent_and_limited_to_the_focused_pane
          cargo test -p warpui --lib celestial
          cargo test -p warpui_core --lib signed_cursor_fill
      - name: Reject warnings in patched libraries
        working-directory: warp
        run: cargo clippy -p warp -p warpui -p warpui_core --lib -- -D warnings

  publish:
    name: Publish verified source release
    needs: [source_checks, metal_poc, warp_patch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build deterministic source archive
        run: |
          version="$(tr -d '\n' < VERSION)"
          archive="warp-celestial-v${version}-source.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="warp-celestial-v${version}/" \
            --output="$archive" \
            HEAD
          sha256sum "$archive" > "${archive}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\n' < VERSION)"
          archive="warp-celestial-v${version}-source.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "${archive}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Warp Celestial $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
